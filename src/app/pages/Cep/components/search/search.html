<form [formGroup]="searchForm" class="form" (ngSubmit)="search()">
  <mat-form-field class="input">
    <input matInput placeholder="Busca por CEP:" formControlName="cep" cepMask>
  </mat-form-field>

  <button class="button" matButton="outlined" [disabled]="loading() || searchForm.invalid">Buscar</button>
</form>
